<!-- ===================== الترويسة ===================== -->
<header class="topbar">
  <div class="brand">
    <div class="brand-badge" id="brandBadge"></div>
    <div class="brand-text">
      <h1 class="brand-title" id="brandTitle">Human <span>Anatomy</span></h1>
      <p class="brand-sub" id="brandSub">Explore &nbsp;•&nbsp; Learn &nbsp;•&nbsp; Understand</p>
    </div>
  </div>

  <p class="slogan" id="slogan">اكتشف جسم الإنسان … بعين جديدة</p>

  <div class="top-actions">
    <div class="search-wrap">
      <svg class="ic search-ic"><use href="#i-search"></use></svg>
      <input type="search" id="search" autocomplete="off" spellcheck="false" placeholder="ابحث عن عضو …" aria-label="بحث">
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang-btn" data-lang="ar" id="langAr">AR</button>
      <button class="lang-btn" data-lang="en" id="langEn">EN</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="المظهر" aria-label="Theme">
      <svg class="ic"><use href="#i-moon" id="themeIcon"></use></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" title="الإعدادات" aria-label="Settings">
      <svg class="ic"><use href="#i-gear"></use></svg>
    </button>
  </div>
</header>

<!-- ===================== الجسم ===================== -->
<main class="layout">

  <!-- الشريط الجانبي -->
  <aside class="sidebar">
    <nav class="systems" id="systemList" aria-label="Systems"></nav>
    <nav class="bottom-nav" id="bottomNav" aria-label="Views">
      <button class="nav-btn is-active" data-view="home"><svg class="ic"><use href="#i-home"></use></svg><span>الرئيسية</span></button>
      <button class="nav-btn" data-view="library"><svg class="ic"><use href="#i-book"></use></svg><span>المكتبة</span></button>
      <button class="nav-btn" data-view="favorites"><svg class="ic"><use href="#i-star"></use></svg><span>المفضلة</span></button>
      <button class="nav-btn" data-view="diseases" id="navDiseases"><svg class="ic"><use href="#i-stetho"></use></svg><span>الأمراض</span></button>
      <button class="nav-btn" data-view="drugs" id="navDrugs"><svg class="ic"><use href="#i-pill"></use></svg><span>الأدوية</span></button>
      <button class="nav-btn" data-view="ref" id="navRef"><svg class="ic"><use href="#i-flask"></use></svg><span>المراجع</span></button>
    </nav>
  </aside>

  <!-- المسرح -->
  <section class="stage" id="stage">
    <div class="stage-glow" aria-hidden="true"></div>

    <div class="stage-view" id="stageView">
      <div class="stage-figure" id="stageFigure">
        <img class="stage-img" id="stageImg" alt="">
        <div class="label-layer" id="labelLayer" aria-hidden="true" hidden></div>
        <div class="img-placeholder" id="stagePlaceholder">
          <svg viewBox="0 0 200 200" class="ph-art" aria-hidden="true">
            <defs><linearGradient id="phg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="currentColor" stop-opacity=".30"/>
              <stop offset="1" stop-color="currentColor" stop-opacity=".05"/>
            </linearGradient></defs>
            <circle cx="100" cy="100" r="84" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="1.4" stroke-dasharray="6 9"/>
            <circle cx="100" cy="100" r="66" fill="url(#phg)"/>
            <g fill="none" stroke="currentColor" stroke-opacity=".62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="100" cy="55" r="11"/>
              <path d="M100 68v52"/>
              <path d="M74 82h52"/>
              <path d="M84 148l16-28 16 28"/>
            </g>
            <path d="M46 100h22l9-19 13 40 11-27 8 14h45" fill="none"
                  stroke="currentColor" stroke-opacity=".30" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="ph-text" id="phText">الصورة قريباً</p>
          <p class="ph-file" id="phFile"></p>
        </div>
      </div>
    </div>

    <!-- شبكة المكتبة / المفضلة -->
    <div class="grid-view" id="gridView" hidden>
      <h2 class="grid-title" id="gridTitle"></h2>

      <!-- المستوى الثاني: رأس صفحة القسم (اسمه · عدده · زر رجوع للفهرس) -->
      <div class="lib-head" id="libHead" hidden>
        <button class="lib-back" id="libBack" type="button">
          <svg class="ic"><use href="#i-chev"></use></svg>
          <span id="libBackText"></span>
        </button>
        <span class="lib-head-titles">
          <span class="lib-head-ar" id="libHeadAr"></span>
          <span class="lib-head-en" id="libHeadEn"></span>
        </span>
        <span class="lib-head-count" id="libHeadCount"></span>
      </div>

      <!-- المستوى الأول: فهرس الأقسام -->
      <div class="lib-secs" id="gridSecs" hidden></div>

      <!-- بطاقات العناصر: صفحة قسم · مفضلة · نتائج بحث -->
      <div class="grid-cards" id="gridCards"></div>
      <p class="grid-empty" id="gridEmpty" hidden></p>
    </div>

    <!-- ===== موسوعة الأمراض: فهرس ثم بطاقة مرض ===== -->
    <div class="dis-view" id="disView" hidden>

      <!-- المستوى الأول: الفهرس -->
      <div class="dx-index" id="dxIndex" hidden>
        <h2 class="grid-title" id="dxTitle"></h2>
        <p class="dx-count" id="dxCount"></p>
        <div class="dx-search">
          <svg class="ic dx-search-ic"><use href="#i-search"></use></svg>
          <input type="search" id="dxSearch" autocomplete="off" spellcheck="false">
        </div>
        <div class="dx-groups" id="dxGroups"></div>
        <p class="grid-empty" id="dxEmpty" hidden></p>
      </div>

      <!-- المستوى الثاني: بطاقة المرض -->
      <article class="dx-page" id="dxPage" hidden></article>
    </div>

    <!-- ===================== موسوعة الأدوية ===================== -->
    <div class="dis-view" id="rxView" hidden>
      <div class="dx-index" id="rxIndex" hidden>
        <h2 class="grid-title" id="rxTitle"></h2>
        <p class="dx-count" id="rxCount"></p>
        <div class="dx-search">
          <svg class="ic dx-search-ic"><use href="#i-search"></use></svg>
          <input type="search" id="rxSearch" autocomplete="off" spellcheck="false">
        </div>
        <div class="dx-groups" id="rxGroups"></div>
        <p class="grid-empty" id="rxEmpty" hidden></p>
      </div>
      <article class="dx-page" id="rxPage" hidden></article>
    </div>

    <!-- =============== البطاقات المرجعية: فحوص · جينوم · فحوص جينية =============== -->
    <div class="dis-view" id="refView" hidden>
      <div class="dx-index" id="refIndex" hidden>
        <h2 class="grid-title" id="refTitle"></h2>
        <p class="dx-count" id="refCount"></p>
        <div class="dx-search">
          <svg class="ic dx-search-ic"><use href="#i-search"></use></svg>
          <input type="search" id="refSearch" autocomplete="off" spellcheck="false">
        </div>
        <div class="dx-groups" id="refGroups"></div>
        <p class="grid-empty" id="refEmpty" hidden></p>
      </div>
      <article class="dx-page" id="refPage" hidden></article>
    </div>

    <!-- شريط الأدوات -->
    <div class="toolbar" id="toolbar">
      <button class="tool" data-tool="rotate"><svg class="ic"><use href="#i-rotate"></use></svg><span>تدوير</span></button>
      <button class="tool" data-tool="labels" id="labelsTool"><svg class="ic"><use href="#i-label"></use></svg><span>الأسماء</span></button>
      <button class="tool" data-tool="zoomin"><svg class="ic"><use href="#i-plus"></use></svg><span>تكبير</span></button>
      <button class="tool" data-tool="zoomout"><svg class="ic"><use href="#i-minus"></use></svg><span>تصغير</span></button>
      <button class="tool" data-tool="reset"><svg class="ic"><use href="#i-reset"></use></svg><span>إعادة الضبط</span></button>
      <button class="tool" data-tool="fullscreen"><svg class="ic"><use href="#i-expand"></use></svg><span>ملء الشاشة</span></button>
    </div>
  </section>

  <!-- بانل المعلومات -->
  <aside class="panel" id="panel">
    <header class="panel-head">
      <div class="panel-id">
        <div class="panel-thumb" id="panelThumb"></div>
        <div class="panel-titles">
          <h2 class="panel-title" id="panelTitle"></h2>
          <p class="panel-sub" id="panelSub"></p>
        </div>
      </div>
      <button class="fav-btn" id="favBtn" aria-label="Favorite">
        <svg class="ic"><use href="#i-heart"></use></svg>
      </button>
    </header>

    <div class="tabs" id="tabs" role="tablist">
      <button class="tab is-active" data-tab="info" role="tab">معلومات</button>
      <button class="tab" data-tab="function" role="tab">الوظيفة</button>
      <button class="tab" data-tab="diseases" role="tab">الأمراض</button>
    </div>

    <div class="panel-body" id="panelBody"></div>

  </aside>
</main>

<!-- ===================== الإعدادات ===================== -->
<div class="modal-back" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h3 id="setTitle">الإعدادات</h3>
      <button class="icon-btn" id="setClose" aria-label="Close"><svg class="ic"><use href="#i-close"></use></svg></button>
    </header>
    <div class="modal-body">
      <div class="set-row">
        <span id="setLangLabel">اللغة</span>
        <div class="seg" id="setLang">
          <button data-lang="ar">AR — عربي</button>
          <button data-lang="en">EN — English</button>
        </div>
      </div>
      <div class="set-row">
        <span id="setThemeLabel">المظهر</span>
        <div class="seg" id="setTheme">
          <button data-set-theme="dark" id="setDark">غامق</button>
          <button data-set-theme="light" id="setLight">فاتح</button>
        </div>
      </div>
      <p class="disclaimer" id="disclaimer"></p>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="diseases.js"></script>
